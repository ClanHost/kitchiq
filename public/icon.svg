<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with Safe Zone -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#brandGrad)" />

  <!-- Inner Safe Zone Icon Group -->
  <g filter="url(#shadow)">
    <!-- Fridge Silhouette -->
    <rect x="136" y="104" width="240" height="304" rx="32" fill="#ffffff" />
    
    <!-- Top Freezer Divider -->
    <line x1="136" y1="210" x2="376" y2="210" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
    
    <!-- Fridge Door Handles -->
    <rect x="156" y="148" width="10" height="42" rx="5" fill="#059669" />
    <rect x="156" y="230" width="10" height="70" rx="5" fill="#059669" />

    <!-- Fridge Screen / Smart Panel -->
    <rect x="194" y="132" width="144" height="60" rx="12" fill="#0f172a" />
    <!-- Screen Accent Display Elements -->
    <circle cx="218" cy="162" r="8" fill="#10b981" />
    <rect x="238" y="150" width="56" height="8" rx="4" fill="#38bdf8" />
    <rect x="238" y="166" width="80" height="6" rx="3" fill="#94a3b8" />

    <!-- Barcode / Stock Graphic on Lower Door -->
    <!-- Barcode Bars -->
    <g transform="translate(186, 240)">
      <rect x="0" y="0" width="6" height="46" fill="#1e293b" rx="2" />
      <rect x="10" y="0" width="12" height="46" fill="#1e293b" rx="2" />
      <rect x="28" y="0" width="4" height="46" fill="#1e293b" rx="2" />
      <rect x="38" y="0" width="10" height="46" fill="#1e293b" rx="2" />
      <rect x="54" y="0" width="16" height="46" fill="#1e293b" rx="2" />
      <rect x="76" y="0" width="6" height="46" fill="#1e293b" rx="2" />
      <rect x="88" y="0" width="12" height="46" fill="#1e293b" rx="2" />
      <rect x="106" y="0" width="8" height="46" fill="#1e293b" rx="2" />
      <rect x="120" y="0" width="14" height="46" fill="#1e293b" rx="2" />
      
      <!-- Laser Scanning Beam -->
      <line x1="-10" y1="23" x2="150" y2="23" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
      <circle cx="70" cy="23" r="5" fill="#f87171" />
    </g>

    <!-- Grocery Accent Icon (Leaf / Apple symbol) -->
    <g transform="translate(202, 316)">
      <circle cx="36" cy="42" r="32" fill="#10b981" />
      <circle cx="72" cy="42" r="32" fill="#059669" />
      <path d="M 54 18 C 54 10, 68 8, 70 2 C 60 4, 52 10, 54 18 Z" fill="#15803d" />
      <!-- Checkmark -->
      <path d="M 40 42 L 50 52 L 68 34" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
